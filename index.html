<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dean Bittker</title>
  <meta name="description" content="Dean Bittker — proteins, chemistry, and machine learning at MIT.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,8 86,29 86,71 50,92 14,71 14,29' fill='none' stroke='%230053D6' stroke-width='9'/><circle cx='50' cy='50' r='11' fill='%23FF7D45'/></svg>">
  <style>
    :root {
      --bg: #fbfbf9;
      --text: #1b1b1b;
      --muted: #74746e;
      --faint: #b9b9b2;
      --rule: #e3e3dd;
      --accent: #0053d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111213;
        --text: #ebebe8;
        --muted: #9a9a93;
        --faint: #55565a;
        --rule: #2a2b2d;
        --accent: #65cbf3;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.65 Georgia, "Iowan Old Style", "Times New Roman", serif;
    }
    a { color: inherit; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
    a:hover { text-decoration-color: var(--text); }

    /* ---------- layout ---------- */
    .page {
      display: grid;
      grid-template-columns: minmax(0, 560px) minmax(0, 1fr);
      grid-template-areas: "head stage" "body stage";
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }
    header   { grid-area: head; padding: 14vh 24px 0 max(24px, 8vw); }
    .content { grid-area: body; padding: 0 24px 96px max(24px, 8vw); }
    .stage   { grid-area: stage; position: sticky; top: 0; height: 100vh; }

    @media (max-width: 900px) {
      .page { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "stage" "body"; }
      header { padding: 9vh 20px 0; }
      .content { padding: 0 20px 72px; }
      .stage { position: relative; height: min(68vh, 520px); }
    }

    /* ---------- text ---------- */
    h1 {
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: -0.015em;
      margin: 0;
    }
    .formula {
      margin: 0.35rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    section { margin-top: 2.6rem; }
    h2 {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      font-size: 0.78rem;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 0 0 0.8rem;
    }
    h2 .n { color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: 0; }
    h2::after { content: ""; flex: 1; border-top: 1px solid var(--rule); transform: translateY(-0.25em); }
    .placeholder { height: 0.9rem; width: 70%; border-radius: 3px; background: var(--rule); margin: 0.55rem 0; }
    .placeholder.short { width: 45%; }
    .links { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; }
    footer { margin-top: 3.5rem; font-size: 0.8rem; color: var(--muted); }

    /* ---------- protein stage ---------- */
    #viewer { position: absolute; inset: 0; }
    #viewer canvas { outline: none; }
    .stage { cursor: grab; touch-action: pan-y; transition: opacity 0.5s ease; }
    .stage.dragging { cursor: grabbing; }
    .stage.fading { opacity: 0; }
    #callout { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    #callout line { stroke: var(--muted); stroke-width: 1; }
    #callout circle { fill: none; stroke: var(--muted); stroke-width: 1; }
    .ligand {
      position: absolute;
      left: 0;
      top: 15%;
      max-width: 220px;
      font-size: 0.82rem;
      line-height: 1.4;
      color: var(--muted);
      pointer-events: none;
    }
    .ligand b { display: block; font-weight: normal; color: var(--text); font-size: 0.95rem; }
    .caption {
      position: absolute;
      right: 24px;
      bottom: 20px;
      text-align: right;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .caption a { color: var(--muted); }
    .caption button {
      font: inherit;
      color: var(--muted);
      background: none;
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 0.05em 0.7em;
      margin-left: 0.4em;
      cursor: pointer;
    }
    .caption button:hover { color: var(--text); border-color: var(--muted); }
    .legend { display: inline-flex; align-items: center; gap: 0.4em; }
    .legend i { display: inline-block; width: 64px; height: 6px; border-radius: 3px;
      background: linear-gradient(90deg, #0053d6, #65cbf3, #ffdb13, #ff7d45); }
    @media (max-width: 900px) {
      .ligand { left: 20px; top: 6px; }
      .caption { right: 20px; bottom: 6px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Dean Bittker</h1>
    </header>

    <div class="stage" id="stage" aria-label="Rotating 3D protein structure">
      <div id="viewer"></div>
      <svg id="callout" aria-hidden="true"><line id="leader"/><circle id="dot" r="16"/></svg>
      <div class="ligand" id="ligand"></div>
      <div class="caption" id="caption"></div>
    </div>

    <main class="content">
      <section>
        <h2><span class="n">01</span>About</h2>
        <div class="placeholder"></div>
        <div class="placeholder short"></div>
      </section>
      <section>
        <h2><span class="n">02</span>Now</h2>
        <div class="placeholder short"></div>
      </section>
      <section>
        <h2><span class="n">03</span>Research</h2>
        <div class="placeholder"></div>
        <div class="placeholder"></div>
      </section>
      <section>
        <h2><span class="n">04</span>Projects</h2>
        <div class="placeholder"></div>
        <div class="placeholder short"></div>
      </section>
      <section>
        <h2><span class="n">05</span>Writing &amp; notes</h2>
        <div class="placeholder short"></div>
      </section>
      <section>
        <h2><span class="n">06</span>Elsewhere</h2>
        <ul class="links">
          <li><a href="mailto:dbittker@mit.edu">Email</a></li>
          <li><a href="https://github.com/DeanBittker">GitHub</a></li>
          <li><a href="#">LinkedIn</a></li>
        </ul>
      </section>
      <footer>&copy; <span id="y">2026</span> Dean Bittker</footer>
    </main>
  </div>

  <script src="vendor/3Dmol-2.5.5.min.js"></script>
  <script>
  (() => {
    document.getElementById('y').textContent = new Date().getFullYear();

    const PROTEINS = [
      { file: 'gfp', name: 'Green fluorescent protein (S65T)', pdb: '1EMA',
        ligand: { resn: 'CRO' }, label: 'Chromophore', sub: 'Thr65–Tyr66–Gly67, cyclized inside the β-barrel' },
      { file: 'sh3', name: 'GRB2 C-terminal SH3 domain', pdb: '2VWF',
        ligand: { chain: 'B' }, label: 'Proline-rich peptide', sub: 'bound in the SH3 binding groove' },
      { file: 'tem', name: 'TEM-1 β-lactamase', pdb: '1FQG',
        ligand: { resn: 'PNM' }, label: 'Penicillin G', sub: 'caught as an acyl-enzyme on Ser70' },
    ];

    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // AlphaFold confidence palette, used here for ordered → flexible (crystallographic B-factor).
    const STOPS = [dark ? [70, 130, 240] : [0, 83, 214], [101, 203, 243], [255, 219, 19], [255, 125, 69]];
    const hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
    const ramp = t => {
      const x = Math.max(0, Math.min(0.999, t)) * (STOPS.length - 1);
      const i = Math.floor(x), f = x - i;
      return hex([0, 1, 2].map(k => Math.round(STOPS[i][k] + (STOPS[i + 1][k] - STOPS[i][k]) * f)));
    };
    const elem = carbon => ({ prop: 'elem', map: { C: carbon, O: '#e8402a', N: '#2f66e6', S: '#e2b021', SE: '#e2b021' } });

    const stage = document.getElementById('stage');
    const ligandEl = document.getElementById('ligand');
    const caption = document.getElementById('caption');
    const leader = document.getElementById('leader');
    const dot = document.getElementById('dot');

    const viewer = $3Dmol.createViewer(document.getElementById('viewer'), {
      backgroundColor: 'white', backgroundAlpha: 0, antialias: true, nomouse: true,
    });

    let current = -1, centroid = null, visible = true;

    async function show(idx) {
      current = idx;
      const p = PROTEINS[idx];
      const text = await fetch(`structures/${p.file}.pdb`).then(r => r.text());

      viewer.clear();
      const model = viewer.addModel(text, 'pdb');
      const atoms = model.selectedAtoms({});
      const bs = atoms.filter(a => a.atom === 'CA').map(a => a.b).sort((a, b) => a - b);
      const lo = bs[Math.floor(bs.length * 0.1)], hi = bs[bs.length - 1];
      const ligSel = p.ligand;

      viewer.setStyle({ not: ligSel }, {
        cartoon: { colorfunc: a => ramp(Math.pow(Math.max(0, (a.b - lo) / (hi - lo || 1)), 1.4)), thickness: 0.35, arrows: true },
      });
      // binding-pocket side chains as thin sticks
      // (the trimmed structure files only keep side chains for residues touching the chemical)
      const pocket = [...new Set(atoms.filter(a => a.atom === 'CB' && a.chain === 'A' && !a.hetflag).map(a => a.resi))];
      if (pocket.length) {
        viewer.addStyle({ chain: 'A', hetflag: false, resi: pocket, not: { atom: ['N', 'C', 'O'] } },
                        { stick: { radius: 0.09, colorscheme: elem(dark ? '#8a8a86' : '#9b9b96') } });
      }
      // the chemical: ball-and-stick
      viewer.setStyle(ligSel, {
        stick: { radius: 0.17, colorscheme: elem(dark ? '#d9d9d4' : '#3c3c3a') },
        sphere: { scale: 0.26, colorscheme: elem(dark ? '#d9d9d4' : '#3c3c3a') },
      });

      const lig = model.selectedAtoms(ligSel);
      centroid = lig.reduce((c, a) => ({ x: c.x + a.x / lig.length, y: c.y + a.y / lig.length, z: c.z + a.z / lig.length }), { x: 0, y: 0, z: 0 });

      viewer.zoomTo();
      viewer.zoom(0.82);
      viewer.rotate(-20, 'x');
      viewer.render();

      ligandEl.innerHTML = `<b>${p.label}</b>${p.sub}`;
      caption.innerHTML =
        `<a href="https://www.rcsb.org/structure/${p.pdb}" target="_blank" rel="noopener">${p.name} · PDB ${p.pdb}</a>` +
        `<button type="button" title="Show another protein">↻ next</button><br>` +
        `<span class="legend">ordered <i></i> flexible</span>`;
      caption.querySelector('button').onclick = next;
      updateCallout();
    }

    function next() {
      stage.classList.add('fading');
      setTimeout(async () => {
        await show((current + 1) % PROTEINS.length);
        stage.classList.remove('fading');
      }, 500);
    }

    // Leader line from the label to the bound chemical, tracked as the protein turns.
    function updateCallout() {
      if (!centroid) return;
      const s = viewer.modelToScreen(centroid);          // page coordinates
      const sr = stage.getBoundingClientRect();
      const tx = s.x - scrollX - sr.left, ty = s.y - scrollY - sr.top;
      const lr = ligandEl.getBoundingClientRect();
      const lx = lr.left - sr.left + Math.min(lr.width, 160) * 0.5, ly = lr.bottom - sr.top + 6;
      leader.setAttribute('x1', lx); leader.setAttribute('y1', ly);
      leader.setAttribute('x2', tx); leader.setAttribute('y2', ty);
      dot.setAttribute('cx', tx); dot.setAttribute('cy', ty);
    }

    // Motion: slow spin, scroll turns it, drag spins it.
    let last = performance.now(), lastScroll = scrollY, dragging = false, px = 0, py = 0, vx = 0;
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (visible && !dragging) {
        const ds = scrollY - lastScroll; lastScroll = scrollY;
        const spin = (reduceMotion ? 0 : 6) * dt + ds * 0.12 + vx;
        vx *= 0.92;
        if (Math.abs(spin) > 1e-4) { viewer.rotate(spin, 'y'); viewer.render(); }
        updateCallout();
      }
      requestAnimationFrame(frame);
    }

    stage.addEventListener('pointerdown', e => {
      if (e.target.closest('.caption')) return;
      dragging = true; px = e.clientX; py = e.clientY; vx = 0;
      stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
      viewer.rotate(dx * 0.4, 'y'); viewer.rotate(dy * 0.4, 'x'); viewer.render();
      vx = dx * 0.1; updateCallout();
    });
    const end = () => { dragging = false; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);

    new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(stage);
    addEventListener('resize', () => { viewer.resize(); viewer.render(); updateCallout(); });

    show(Math.floor(Math.random() * PROTEINS.length)).then(() => requestAnimationFrame(frame));
  })();
  </script>
</body>
</html>
