<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dean Bittker</title>
  <meta name="description" content="Dean Bittker — proteins, chemistry, and machine learning at MIT.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,8 86,29 86,71 50,92 14,71 14,29' fill='none' stroke='%230053D6' stroke-width='9'/><circle cx='50' cy='50' r='11' fill='%23FF7D45'/></svg>">
  <style>
    :root {
      --bg: #fbfbf9;
      --text: #1b1b1b;
      --muted: #74746e;
      --faint: #b9b9b2;
      --rule: #e3e3dd;
      --accent: #0053d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111213;
        --text: #ebebe8;
        --muted: #9a9a93;
        --faint: #55565a;
        --rule: #2a2b2d;
        --accent: #65cbf3;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.65 Georgia, "Iowan Old Style", "Times New Roman", serif;
    }
    a { color: inherit; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
    a:hover { text-decoration-color: var(--text); }

    /* ---------- layout ---------- */
    main {
      position: relative;
      z-index: 1;
      max-width: 620px;
      margin: 0 auto;
      padding: 16vh 24px 96px;
    }
    @media (min-width: 1100px) { main { margin-left: max(24px, 12vw); } }

    /* ---------- intro ---------- */
    header { display: flex; align-items: center; gap: 1.25rem; }
    .portrait {
      flex: none;
      width: 84px; height: 84px;
      border-radius: 50%;
      background: var(--rule);
      object-fit: cover;
    }
    h1 { font-size: 2.1rem; font-weight: normal; letter-spacing: -0.015em; margin: 0; line-height: 1.2; }
    .tagline { margin: 0.2rem 0 0; color: var(--muted); }
    .tagline .placeholder { width: 240px; margin: 0.45rem 0 0; }

    /* ---------- sections ---------- */
    section { margin-top: 2.8rem; }
    h2 {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      font-size: 0.78rem;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 0 0 0.8rem;
    }
    h2::after { content: ""; flex: 1; border-top: 1px solid var(--rule); transform: translateY(-0.25em); }
    .placeholder { height: 0.9rem; width: 80%; border-radius: 3px; background: var(--rule); margin: 0.55rem 0; }
    .placeholder.short { width: 50%; }
    .links { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; }
    footer { margin-top: 3.5rem; font-size: 0.8rem; color: var(--muted); }

    /* ---------- background protein ---------- */
    #bg {
      position: fixed;
      top: 0; bottom: 0;
      right: -12vw;
      width: 72vw;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 45%);
              mask-image: linear-gradient(to right, transparent, #000 45%);
    }
    #bg.on { opacity: var(--protein-opacity); }
    :root { --protein-opacity: 0.22; }
    @media (prefers-color-scheme: dark) { :root { --protein-opacity: 0.26; } }
    @media (max-width: 900px) {
      #bg { right: -30vw; width: 110vw; }
      :root { --protein-opacity: 0.12; }
    }
    .credit {
      position: fixed;
      right: 16px;
      bottom: 12px;
      z-index: 1;
      font-size: 0.72rem;
      color: var(--faint);
    }
    .credit a { color: var(--faint); text-decoration: none; }
    .credit a:hover { color: var(--muted); }
    @media (max-width: 900px) { .credit { display: none; } }
  </style>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <main>
    <header>
      <div class="portrait" role="img" aria-label="Photo of Dean Bittker"></div>
      <div>
        <h1>Dean Bittker</h1>
        <div class="tagline"><div class="placeholder"></div></div>
      </div>
    </header>

    <section>
      <h2>About</h2>
      <div class="placeholder"></div>
      <div class="placeholder"></div>
      <div class="placeholder short"></div>
    </section>
    <section>
      <h2>Now</h2>
      <div class="placeholder short"></div>
    </section>
    <section>
      <h2>Research</h2>
      <div class="placeholder"></div>
      <div class="placeholder"></div>
    </section>
    <section>
      <h2>Projects</h2>
      <div class="placeholder"></div>
      <div class="placeholder short"></div>
    </section>
    <section>
      <h2>Writing &amp; notes</h2>
      <div class="placeholder short"></div>
    </section>
    <section>
      <h2>Elsewhere</h2>
      <ul class="links">
        <li><a href="mailto:dbittker@mit.edu">Email</a></li>
        <li><a href="https://github.com/DeanBittker">GitHub</a></li>
        <li><a href="#">LinkedIn</a></li>
      </ul>
    </section>
    <footer>&copy; <span id="y">2026</span> Dean Bittker</footer>
  </main>

  <div class="credit" id="credit"></div>

  <script src="vendor/3Dmol-2.5.5.min.js"></script>
  <script>
  (() => {
    document.getElementById('y').textContent = new Date().getFullYear();

    // Background structures: protein ribbon + the chemical it holds.
    const PROTEINS = [
      { file: 'gfp', name: 'GFP + chromophore', pdb: '1EMA', ligand: { resn: 'CRO' } },
      { file: 'sh3', name: 'GRB2 SH3 + peptide', pdb: '2VWF', ligand: { chain: 'B' } },
      { file: 'tem', name: 'TEM-1 β-lactamase + penicillin G', pdb: '1FQG', ligand: { resn: 'PNM' } },
    ];
    const p = PROTEINS[Math.floor(Math.random() * PROTEINS.length)];

    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // AlphaFold palette (ordered → flexible, by crystallographic B-factor)
    const STOPS = [dark ? [70, 130, 240] : [0, 83, 214], [101, 203, 243], [255, 219, 19], [255, 125, 69]];
    const hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
    const ramp = t => {
      const x = Math.max(0, Math.min(0.999, t)) * (STOPS.length - 1);
      const i = Math.floor(x), f = x - i;
      return hex([0, 1, 2].map(k => Math.round(STOPS[i][k] + (STOPS[i + 1][k] - STOPS[i][k]) * f)));
    };
    const elem = carbon => ({ prop: 'elem', map: { C: carbon, O: '#e8402a', N: '#2f66e6', S: '#e2b021', SE: '#e2b021' } });

    document.getElementById('credit').innerHTML =
      `<a href="https://www.rcsb.org/structure/${p.pdb}" target="_blank" rel="noopener">${p.name} · PDB ${p.pdb}</a>`;

    const bg = document.getElementById('bg');
    const viewer = $3Dmol.createViewer(bg, { backgroundColor: 'white', backgroundAlpha: 0, antialias: true, nomouse: true });

    fetch(`structures/${p.file}.pdb`).then(r => r.text()).then(text => {
      const model = viewer.addModel(text, 'pdb');
      const atoms = model.selectedAtoms({});
      const bs = atoms.filter(a => a.atom === 'CA').map(a => a.b).sort((a, b) => a - b);
      const lo = bs[Math.floor(bs.length * 0.1)], hi = bs[bs.length - 1];
      const lig = p.ligand;

      viewer.setStyle({ not: lig }, {
        cartoon: { colorfunc: a => ramp(Math.pow(Math.max(0, (a.b - lo) / (hi - lo || 1)), 1.4)), thickness: 0.35, arrows: true },
      });
      const pocket = [...new Set(atoms.filter(a => a.atom === 'CB' && a.chain === 'A' && !a.hetflag).map(a => a.resi))];
      if (pocket.length) {
        viewer.addStyle({ chain: 'A', hetflag: false, resi: pocket, not: { atom: ['N', 'C', 'O'] } },
                        { stick: { radius: 0.09, colorscheme: elem(dark ? '#8a8a86' : '#9b9b96') } });
      }
      const carbon = dark ? '#d9d9d4' : '#3c3c3a';
      viewer.setStyle(lig, { stick: { radius: 0.17, colorscheme: elem(carbon) }, sphere: { scale: 0.26, colorscheme: elem(carbon) } });

      viewer.zoomTo();
      viewer.zoom(0.9);
      viewer.rotate(-20, 'x');
      viewer.render();
      bg.classList.add('on');

      // Slow drift; scrolling turns it a little.
      let last = performance.now(), lastScroll = scrollY;
      const frame = now => {
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        const spin = (reduceMotion ? 0 : 4) * dt + (scrollY - lastScroll) * 0.08;
        lastScroll = scrollY;
        if (spin) { viewer.rotate(spin, 'y'); viewer.render(); }
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    });
    addEventListener('resize', () => { viewer.resize(); viewer.render(); });
  })();
  </script>
</body>
</html>
